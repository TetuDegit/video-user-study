<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="关注画面细节的三段视频同步盲测问卷">
  <title>视频画面细节评测</title>
  <link rel="stylesheet" href="./styles.css?v=wide-view">
  <script type="module" src="./study.js?v=round-6"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>视频画面细节评测</span>
      </div>
      <span class="study-tag">匿名盲测 <span aria-hidden="true">/</span> <b id="study-count">20</b> 题</span>
    </div>
  </header>

  <main class="layout">
    <section id="survey" aria-labelledby="question">
      <div class="question-header">
        <div class="progress-area">
          <div class="progress-label">
            <span id="question-number">第 01 / 20 题</span>
            <span id="progress-label">已完成 0 题</span>
          </div>
          <progress id="progress" max="20" value="0" aria-label="答题进度"></progress>
        </div>
        <h1 id="question" tabindex="-1">留意画面细节，哪段视频的画质最好？</h1>
        <p class="subtitle">同步观看三段 7 秒视频，留意纹理、边缘和小物体在运动中的表现。用「放大」查看单片，可随时切回并排。</p>
      </div>

      <div class="comparison">
        <div class="toolbar">
          <div class="toolbar-controls">
            <button type="button" class="button primary" id="play" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path id="play-icon" d="M8 5v14l11-7z" fill="currentColor"/></svg>
              <span id="play-label">同步播放</span>
            </button>
            <button type="button" class="button secondary" id="replay" disabled>
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 2 8M4 4v6h6"/></svg>
              从头重播
            </button>
            <button type="button" class="button secondary" id="expand" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5m-5 11h5v-5M9 20H4v-5"/></svg>
              <span id="expand-label">全屏对比</span>
            </button>
          </div>
          <div class="view-controls">
            <div class="view-picker" id="view-picker" role="group" aria-label="画面大小">
              <button type="button" data-view="all" aria-pressed="true">并排</button>
              <span aria-hidden="true">放大</span>
              <button type="button" data-view="A" aria-label="放大 A" aria-pressed="false">A</button>
              <button type="button" data-view="B" aria-label="放大 B" aria-pressed="false">B</button>
              <button type="button" data-view="C" aria-label="放大 C" aria-pressed="false">C</button>
            </div>
            <span id="time" class="time" aria-label="播放时间">0.0 / 7.0 秒</span>
          </div>
        </div>

        <fieldset class="options" aria-describedby="media-status">
          <legend class="sr-only">选择一段视频</legend>
          <div id="cards" class="cards"></div>
        </fieldset>
        <p id="media-status" class="media-status" role="status">正在读取评测配置…</p>
      </div>

      <div class="survey-footer">
        <p id="footer-note">看完三段视频后，选择 A、B 或 C。</p>
        <button type="button" id="next" class="button primary" disabled>
          <span id="next-label">下一题</span>
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
        </button>
      </div>
    </section>

    <section id="complete" class="complete" aria-labelledby="complete-title" hidden>
      <span class="complete-mark" aria-hidden="true">✓</span>
      <p class="complete-count" id="complete-count">20 / 20</p>
      <h1 id="complete-title" tabindex="-1">评测已完成</h1>
      <p>感谢参与。你可以下载本次评测的答题记录。</p>
      <button type="button" class="button primary" id="download">下载答题记录</button>
    </section>
    <p id="storage-status" class="storage-status" role="status"></p>
  </main>

  <template id="card">
    <div class="card">
      <div class="viewport">
        <video muted playsinline preload="auto" disablepictureinpicture disableremoteplayback hidden></video>
        <span class="placeholder" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.25"><rect x="2" y="5" width="28" height="22" rx="4"/><path d="m13 11 8 5-8 5z"/></svg>
        </span>
      </div>
      <label class="choice">
        <span class="choice-name"><span class="letter"></span><span class="choice-caption"></span></span>
        <input type="radio" name="selection" disabled>
      </label>
    </div>
  </template>
</body>
</html>
